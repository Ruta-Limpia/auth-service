name: CI/CD auth-service

# develop: build, tests e imagen Docker probada con MySQL (ambiente de pruebas)
# main: lo mismo, y ademas publica la imagen en Amazon ECR y la despliega
#       en el cluster Docker Swarm de la EC2 (produccion)
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar, correr los tests y empaquetar
        run: ./mvnw -B verify

      - name: Guardar reportes de tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-tests
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Guardar el jar
        uses: actions/upload-artifact@v7
        with:
          name: auth-service-jar
          path: target/auth-service-*.jar
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Imagen Docker y prueba con MySQL
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # la imagen se compila desde el codigo fuente (Dockerfile multi-etapa)
      - name: Construir la imagen y levantarla con MySQL
        run: bash deploy/desplegar.sh

      - name: Probar endpoints sobre el contenedor
        run: |
          curl -fsS http://localhost:8081/actuator/health
          codigo=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"email":"admin@rutalimpia.cl","password":"123456"}' http://localhost:8081/api/v1/auth/login)
          echo "login admin: $codigo"
          test "$codigo" = "200"

      - name: Revisar que la imagen no corra como root
        run: |
          usuario=$(docker inspect --format '{{.Config.User}}' auth-service:local)
          echo "usuario de la imagen: $usuario"
          test -n "$usuario" && test "$usuario" != "root"

      - name: Logs del contenedor
        if: failure()
        run: docker compose logs --tail 200

      - name: Bajar los contenedores
        if: always()
        run: docker compose down -v

  publicar:
    name: Publicar imagen en Amazon ECR
    needs: docker
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      ECR_REPO: auth-service
      INSTANCIA: ${{ vars.EC2_INSTANCE_NAME || 'auth-service' }}
    steps:
      - uses: actions/checkout@v7

      - name: Configurar credenciales temporales de AWS Academy
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # repositorio ECR y reglas del security group, se crean solo si faltan
      - name: Crear recursos de AWS
        run: bash deploy/aws-recursos.sh

      - name: Iniciar sesion en ECR
        run: |
          cuenta=$(aws sts get-caller-identity --query Account --output text)
          registro="$cuenta.dkr.ecr.$AWS_REGION.amazonaws.com"
          echo "IMAGEN=$registro/$ECR_REPO" >> "$GITHUB_ENV"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registro"

      # cada version queda con el hash del commit, asi se puede volver a cualquiera
      - name: Construir y subir la imagen
        run: |
          docker build -t "$IMAGEN:$GITHUB_SHA" -t "$IMAGEN:latest" .
          docker push "$IMAGEN:$GITHUB_SHA"
          docker push "$IMAGEN:latest"

      - name: Cerrar sesion en ECR
        if: always()
        run: docker logout "${IMAGEN%%/*}" || true

  deploy:
    name: Deploy en Docker Swarm (EC2)
    needs: publicar
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: ${{ steps.instancia.outputs.url }}
    concurrency:
      group: deploy-produccion
      cancel-in-progress: false
    env:
      AWS_REGION: us-east-1
      ECR_REPO: auth-service
      INSTANCIA: ${{ vars.EC2_INSTANCE_NAME || 'auth-service' }}
      WORKER: ${{ vars.EC2_WORKER_NAME || 'auth-service-worker' }}
      EC2_USER: ubuntu
    steps:
      - uses: actions/checkout@v7

      - name: Configurar credenciales temporales de AWS Academy
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # el manager es obligatorio; el worker es opcional y se suma si existe
      - name: Buscar las EC2
        id: instancia
        run: |
          buscar() {
              aws ec2 describe-instances \
                --filters "Name=tag:Name,Values=$1" "Name=instance-state-name,Values=running" \
                --query 'Reservations[].Instances[] | [0].[InstanceId, PublicIpAddress, PrivateIpAddress]' --output text
          }
          read -r id ip privada <<< "$(buscar "$INSTANCIA")"
          if [ -z "$id" ] || [ "$id" = "None" ] || [ -z "$ip" ] || [ "$ip" = "None" ]; then
              echo "::error::No hay una EC2 corriendo con el nombre '$INSTANCIA' y una IP publica (revisa que el Learner Lab este encendido)"
              exit 1
          fi
          echo "manager $id en $ip (privada $privada)"
          {
              echo "EC2_ID=$id"
              echo "EC2_HOST=$ip"
              echo "EC2_PRIVADA=$privada"
          } >> "$GITHUB_ENV"
          echo "url=http://$ip:8081/actuator/health" >> "$GITHUB_OUTPUT"

          read -r wid wip _ <<< "$(buscar "$WORKER")"
          if [ -n "$wid" ] && [ "$wid" != "None" ] && [ -n "$wip" ] && [ "$wip" != "None" ]; then
              echo "worker $wid en $wip"
              echo "WORKER_ID=$wid" >> "$GITHUB_ENV"
              echo "WORKER_HOST=$wip" >> "$GITHUB_ENV"
          else
              echo "sin worker '$WORKER': el stack corre solo en el manager"
          fi

          cuenta=$(aws sts get-caller-identity --query Account --output text)
          echo "REGISTRO=$cuenta.dkr.ecr.$AWS_REGION.amazonaws.com" >> "$GITHUB_ENV"

      # llave SSH de un solo uso: EC2 Instance Connect la acepta por 60 segundos,
      # y la conexion maestra queda abierta para el resto de los pasos
      - name: Conectar con EC2 Instance Connect
        run: |
          install -m 700 -d ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/deploy
          conectar() {
              cat >> ~/.ssh/config <<EOF
          Host $1
            HostName $2
            User $EC2_USER
            IdentityFile ~/.ssh/deploy
            StrictHostKeyChecking accept-new
            ConnectTimeout 20
            ControlMaster auto
            ControlPath ~/.ssh/cm-%C
            ControlPersist 15m
          EOF
              aws ec2-instance-connect send-ssh-public-key \
                --instance-id "$3" --instance-os-user "$EC2_USER" \
                --ssh-public-key "file://$HOME/.ssh/deploy.pub" > /dev/null
              ssh -fN "$1"
              ssh "$1" 'echo "conectado a $(hostname)"'
          }
          conectar ec2 "$EC2_HOST" "$EC2_ID"
          if [ -n "${WORKER_ID:-}" ]; then
              conectar worker "$WORKER_HOST" "$WORKER_ID"
          fi

      # las claves de MySQL, JWT y la API interna se generan en la EC2 la primera vez
      # y de ahi salen los secretos del Swarm
      - name: Preparar la EC2
        env:
          SEED_DATA: ${{ vars.SEED_DATA || 'never' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          ssh ec2 'mkdir -p auth-service/swarm'
          ssh ec2 'cd auth-service && if [ ! -f .env ]; then
              umask 077
              printf "DB_PASSWORD=%s\nJWT_SECRET=%s\nINTERNAL_API_KEY=%s\nSEED_DATA=never\n" \
                "$(openssl rand -hex 16)" "$(openssl rand -hex 32)" "$(openssl rand -hex 16)" > .env
              echo ".env creado"
          fi'
          ssh ec2 "sed -i 's/^SEED_DATA=.*/SEED_DATA=$SEED_DATA/' auth-service/.env"
          if [ -n "$JWT_SECRET" ]; then
              printf '%s' "$JWT_SECRET" | ssh ec2 'v=$(cat); sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$v/" auth-service/.env'
          fi

      - name: Copiar archivos a la EC2
        run: |
          scp docker-stack.yml ec2:auth-service/
          scp swarm/*.sh ec2:auth-service/swarm/

      # si la EC2 todavia tiene la version con Docker Compose, se baja antes de
      # pasar a Swarm (el volumen de compose no se borra)
      - name: Iniciar el cluster Swarm
        run: |
          ssh ec2 'cd auth-service && if [ -f docker-compose.yml ] && [ -n "$(docker compose ps -q 2> /dev/null)" ]; then
              docker compose down
          fi'
          ssh ec2 "bash auth-service/swarm/init-manager.sh $EC2_PRIVADA"

      - name: Sumar el worker al cluster
        if: env.WORKER_ID != ''
        run: |
          # si el worker es una EC2 nueva, primero se le instala Docker
          if ! ssh worker 'command -v docker' > /dev/null; then
              scp deploy/preparar-ec2.sh worker:
              ssh worker 'bash preparar-ec2.sh'
          fi
          scp swarm/unir-worker.sh worker:
          token=$(ssh ec2 'docker swarm join-token -q worker')
          echo "::add-mask::$token"
          ssh worker "sudo bash unir-worker.sh $token $EC2_PRIVADA"

      # el manager baja la imagen de ECR y le pasa el acceso a los workers (--with-registry-auth)
      - name: Desplegar el stack
        run: |
          aws ecr get-login-password | ssh ec2 "docker login --username AWS --password-stdin $REGISTRO"
          ssh ec2 "cd auth-service && set -a && . ./.env && set +a \
              && AUTH_IMAGE=$REGISTRO/$ECR_REPO:$GITHUB_SHA bash swarm/desplegar-stack.sh"

      - name: Estado del cluster
        if: always()
        run: ssh ec2 'bash auth-service/swarm/estado.sh' || true

      - name: Verificar desde internet
        run: |
          curl -fsS --retry 10 --retry-delay 5 --retry-all-errors "http://$EC2_HOST:8081/actuator/health"
          echo
          # con el routing mesh, el worker tambien responde en el 8081
          if [ -n "${WORKER_HOST:-}" ]; then
              curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "http://$WORKER_HOST:8081/actuator/health" \
                || echo "::warning::El worker no responde en el 8081 (revisa que tenga el mismo security group)"
          fi

      - name: Cerrar la conexion
        if: always()
        run: |
          ssh ec2 "docker logout $REGISTRO" > /dev/null 2>&1 || true
          ssh -O exit ec2 2> /dev/null || true
          ssh -O exit worker 2> /dev/null || true
          rm -f ~/.ssh/deploy ~/.ssh/deploy.pub ~/.ssh/config
