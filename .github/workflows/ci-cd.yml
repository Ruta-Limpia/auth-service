name: CI/CD auth-service

# develop: build, tests e imagen Docker (ambiente de pruebas)
# main: lo mismo y ademas el deploy en la EC2 (produccion)
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar, correr los tests y empaquetar
        run: ./mvnw -B verify

      - name: Guardar reportes de tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-tests
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Guardar el jar
        uses: actions/upload-artifact@v7
        with:
          name: auth-service-jar
          path: target/auth-service-*.jar
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Imagen Docker y prueba con MySQL
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bajar el jar del build
        uses: actions/download-artifact@v8
        with:
          name: auth-service-jar
          path: target

      # la imagen se construye y se prueba, pero no se publica en ningun registro
      - name: Construir la imagen y levantarla con MySQL
        run: bash deploy/desplegar.sh

      - name: Probar endpoints sobre el contenedor
        run: |
          curl -fsS http://localhost:8081/actuator/health
          codigo=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"email":"admin@rutalimpia.cl","password":"123456"}' http://localhost:8081/api/v1/auth/login)
          echo "login admin: $codigo"
          test "$codigo" = "200"

      - name: Logs del contenedor
        if: failure()
        run: docker compose logs --tail 200

      - name: Bajar los contenedores
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy en AWS EC2
    needs: docker
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: ${{ steps.instancia.outputs.url }}
    concurrency:
      group: deploy-produccion
      cancel-in-progress: false
    env:
      AWS_REGION: us-east-1
      INSTANCIA: ${{ vars.EC2_INSTANCE_NAME || 'auth-service' }}
      EC2_USER: ubuntu
    steps:
      - uses: actions/checkout@v7

      - name: Bajar el jar del build
        uses: actions/download-artifact@v8
        with:
          name: auth-service-jar
          path: target

      - name: Configurar credenciales temporales de AWS Academy
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Buscar la EC2
        id: instancia
        run: |
          datos=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$INSTANCIA" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[] | [0].[InstanceId, PublicIpAddress]' --output text)
          read -r id ip <<< "$datos"
          if [ -z "$id" ] || [ "$id" = "None" ] || [ -z "$ip" ] || [ "$ip" = "None" ]; then
              echo "::error::No hay una EC2 corriendo con el nombre '$INSTANCIA' y una IP publica (revisa que el Learner Lab este encendido)"
              exit 1
          fi
          echo "EC2 $id en $ip"
          echo "EC2_ID=$id" >> "$GITHUB_ENV"
          echo "EC2_HOST=$ip" >> "$GITHUB_ENV"
          echo "url=http://$ip:8081/actuator/health" >> "$GITHUB_OUTPUT"

      # llave SSH de un solo uso: EC2 Instance Connect la acepta por 60 segundos,
      # y la conexion maestra queda abierta para el resto de los pasos
      - name: Conectar con EC2 Instance Connect
        run: |
          install -m 700 -d ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/deploy
          cat > ~/.ssh/config <<EOF
          Host ec2
            HostName $EC2_HOST
            User $EC2_USER
            IdentityFile ~/.ssh/deploy
            StrictHostKeyChecking accept-new
            ConnectTimeout 20
            ControlMaster auto
            ControlPath ~/.ssh/cm-%C
            ControlPersist 15m
          EOF
          aws ec2-instance-connect send-ssh-public-key \
            --instance-id "$EC2_ID" --instance-os-user "$EC2_USER" \
            --ssh-public-key file://$HOME/.ssh/deploy.pub > /dev/null
          ssh -fN ec2
          ssh ec2 'echo "conectado a $(hostname)"'

      # las claves de MySQL y JWT se crean en la EC2 la primera vez y se mantienen
      - name: Preparar la EC2
        env:
          SEED_DATA: ${{ vars.SEED_DATA || 'never' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          ssh ec2 'rm -rf auth-service/target && mkdir -p auth-service/target auth-service/deploy'
          ssh ec2 'cd auth-service && if [ ! -f .env ]; then
              umask 077
              printf "DB_PASSWORD=%s\nJWT_SECRET=%s\nINTERNAL_API_KEY=%s\nSEED_DATA=never\n" \
                "$(openssl rand -hex 16)" "$(openssl rand -hex 32)" "$(openssl rand -hex 16)" > .env
              echo ".env creado"
          fi'
          ssh ec2 "sed -i 's/^SEED_DATA=.*/SEED_DATA=$SEED_DATA/' auth-service/.env"
          if [ -n "$JWT_SECRET" ]; then
              printf '%s' "$JWT_SECRET" | ssh ec2 'v=$(cat); sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$v/" auth-service/.env'
          fi

      - name: Copiar archivos a la EC2
        run: |
          scp target/auth-service-*.jar ec2:auth-service/target/
          scp Dockerfile .dockerignore docker-compose.yml ec2:auth-service/
          scp deploy/desplegar.sh ec2:auth-service/deploy/

      - name: Desplegar
        run: ssh ec2 'bash auth-service/deploy/desplegar.sh'

      - name: Verificar desde internet
        run: curl -fsS --retry 10 --retry-delay 5 --retry-all-errors "http://$EC2_HOST:8081/actuator/health"

      - name: Cerrar la conexion
        if: always()
        run: |
          ssh -O exit ec2 2> /dev/null || true
          rm -f ~/.ssh/deploy ~/.ssh/deploy.pub ~/.ssh/config
