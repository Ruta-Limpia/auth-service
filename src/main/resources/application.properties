spring.application.name=auth-service
server.port=8081

# Base de datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rl_auth?createDatabaseIfNotExist=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Usuarios de prueba (data.sql)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${SEED_DATA:always}

# Fechas en formato ISO
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# JWT (mismo secreto en los 4 servicios)
app.jwt.secret=${JWT_SECRET:rutalimpia-secreto-super-largo-de-32-chars-minimo}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Clave para /api/v1/internal/**
app.internal.key=${INTERNAL_API_KEY:rl-internal-dev}

# Swagger
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
