spring.application.name=auth-service
server.port=8081

# Base de datos (rl_auth se crea sola la primera vez que arranca el servicio)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rl_auth?createDatabaseIfNotExist=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# data.sql corre despues de que JPA crea las tablas; con SEED_DATA=never no se cargan los usuarios de prueba
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${SEED_DATA:always}

# En Spring Boot 4 (Jackson 3) la propiedad cambio de nombre; las fechas salen en ISO 8601
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# JWT: el secreto tiene que ser el mismo en los 4 servicios
app.jwt.secret=${JWT_SECRET:rutalimpia-secreto-super-largo-de-32-chars-minimo}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Clave compartida para las rutas /api/v1/internal/**
app.internal.key=${INTERNAL_API_KEY:rl-internal-dev}

springdoc.swagger-ui.path=/swagger-ui.html
